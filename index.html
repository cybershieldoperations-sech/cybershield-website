<style>

background:#0a192f;
color:white;
scroll-behavior:smooth;
}

.navbar{
background:#132a4e;
border-bottom:3px solid #00aeef;
}

.navbar-brand img{
height:40px;
}

.nav-link{
color:white!important;
font-weight:600;
}

.hero{
padding:150px 0;
background:linear-gradient(135deg,#132a4e,#0a192f);

}

.btn-main{

}

.service-card{
background:white;
color:#1e293b;
border-radius:12px;
padding:30px;

height:100%;
}

.service-card:hover{
transform:translateY(-8px);

}

.service-card i{

}

background:#0f1e35;

align-items:center;
justify-content:center;
flex-direction:column;
transition:0.3s;
}

.tech-card img{
max-width:120px;
max-height:50px;
margin-bottom:10px;
}

.tech-card span{
font-size:13px;
opacity:0.8;
}

.tech-card:hover{
border:1px solid #00aeef;
transform:translateY(-6px);
box-shadow:0 10px 25px rgba(0,174,239,0.2);
}

.audit-box{
background:#132a4e;
border:2px solid #00aeef;
padding:40px;
border-radius:12px;
}

footer{
background:#050b14;
padding:30px 0;
margin-top:80px;
}

</style>

</head>
